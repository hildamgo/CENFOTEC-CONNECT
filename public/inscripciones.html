                aria-expanded="false"

            </button>

                class="collapse navbar-collapse"

                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">

                            class="nav-link"

                        >
                        Inicio

    </nav>
  <main class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-7">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h2 text-center mb-2">
                        Registrar inscripción
                    </h1>
                    <p class="text-muted text-center mb-4">
                        Inscriba un participante en una actividad.
                    </p>
                    <form
                        id="formInscripcion"
                        novalidate
                    >
                        <div class="mb-3">
                            <label
                                for="selectParticipante"
                                class="form-label"
                            >
                                Participante
                            </label>
                            <select
                                id="selectParticipante"
                                class="form-select"
                            >
                                <option value="">
                                    — Seleccione un participante —
                                </option>
                            </select>
                            <div
                                id="err-participante"
                                class="text-danger small"
                            ></div>
                        </div>
                        <div class="mb-4">
                            <label
                                for="selectActividad"
                                class="form-label"
                            >
                                Actividad
                            </label>
                            <select
                                id="selectActividad"
                                class="form-select"
                            >
                                <option value="">
                                    — Seleccione una actividad —
                                </option>
                            </select>
                            <div
                                id="err-actividad"
                                class="text-danger small"
                            ></div>
                        </div>
                        <div
                            class="d-flex flex-column flex-sm-row gap-2 justify-content-center"
                        >
                            <button
                                type="submit"
                                class="btn btn-primary"
                            >
                                Inscribir participante
                            </button>
                            <button
                                type="reset"
                                id="btnLimpiar"
                                class="btn btn-primary"
                            >
                                Limpiar
                            </button>
                            <a
                                href="lista-inscripciones.html"
                                class="btn btn-primary"
                            >
                                Ver inscripciones
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</main>
