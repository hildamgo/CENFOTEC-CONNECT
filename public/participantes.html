    <main class="container py-5">
        <div class="row justify-content-center">
            <div class="col-12 col-md-10 col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <h1 class="h2 text-center mb-2">
                            Registrar participante
                        </h1>
                        <p class="text-muted text-center mb-4">
                            Complete el formulario para registrar un participante.
                        </p>
                        <form
                            id="formParticipante"
                            novalidate
                        >
                            <div class="mb-3">
                                <label
                                    for="nombre"
                                    class="form-label"
                                >
                                    Nombre completo
                                </label>
                                <input
                                    type="text"
                                    id="nombre"
                                    class="form-control"
                                    placeholder="Nombre completo"
                                >
                                <div
                                    id="err-nombre"
                                    class="text-danger small"
                                ></div>
                            </div>
                            <div class="mb-3">
                                <label
                                    for="identificacion"
                                    class="form-label"
                                >
                                    Identificación
                                </label>
                                <input
                                    type="text"
                                    id="identificacion"
                                    class="form-control"
                                    placeholder="Ej. 1-1111-1111"
                                >
                                <div
                                    id="err-identificacion"
                                    class="text-danger small"
                                ></div>
                            </div>
                            <div class="mb-3">
                                <label
                                    for="correo"
                                    class="form-label"
                                >
                                    Correo electrónico
                                </label>
                                <input
                                    type="email"
                                    id="correo"
                                    class="form-control"
                                    placeholder="correo@ejemplo.com"
                                >
                                <div
                                    id="err-correo"
                                    class="text-danger small"
                                ></div>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label
                                        for="telefono"
                                        class="form-label"
                                    >
                                        Teléfono
                                    </label>
                                    <input
                                        type="tel"
                                        id="telefono"
                                        class="form-control"
                                        placeholder="8888-8888"
                                    >
                                    <div
                                        id="err-telefono"
                                        class="text-danger small"
                                    ></div>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label
                                        for="edad"
                                        class="form-label"
                                    >
                                        Edad
                                    </label>
                                    <input
                                        type="number"
                                        id="edad"
                                        class="form-control"
                                        min="1"
                                        max="120"
                                        placeholder="Ej. 22"
                                    >
                                    <div
                                        id="err-edad"
                                        class="text-danger small"
                                    ></div>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label
                                    for="profesion"
                                    class="form-label"
                                >
                                    Profesión / Carrera
                                </label>
                                <input
                                    type="text"
                                    id="profesion"
                                    class="form-control"
                                    placeholder="Ingeniería de Software"
                                >
                                <div
                                    id="err-profesion"
                                    class="text-danger small"
                                ></div>
                            </div>
                            <div class="mb-3">
                                <label
                                    for="actividadOpcional"
                                    class="form-label"
                                >
                                    Actividad (Opcional)
                                </label>
                                <select
                                    id="actividadOpcional"
                                    class="form-select"
                                >
                                    <option value="">
                                        — Sin actividad —
                                    </option>
                                </select>
                                <div
                                    id="err-actividad"
                                    class="text-danger small"
                                ></div>
                            </div>
                            <div class="mb-4">
                                <label
                                    for="estado"
                                    class="form-label"
                                >
                                    Estado
                                </label>
                                <select
                                    id="estado"
                                    class="form-select"
                                >
                                    <option value="Activo">
                                        Activo
                                    </option>
                                    <option value="Inactivo">
                                        Inactivo
                                    </option>
                                </select>
                            </div>
                            <div
                                class="d-flex flex-column flex-sm-row gap-2 justify-content-center"
                            >
                                <button
                                    type="submit"
                                    class="btn btn-primary"
                                >
                                    Guardar participante
                                </button>
                                <button
                                    type="reset"
                                    id="btnLimpiar"
                                    class="btn btn-primary"
                                >
                                    Limpiar
                                </button>
                                <a
                                    href="lista-participantes.html"
                                    class="btn btn-primary"
                                >
                                    Ver participantes
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
