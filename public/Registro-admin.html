          <img src = "Images/Logo Oficial.jpeg" alt="Logo CENFOTEC Connect"/>

<main>
<section class="Seccion">
<div class="contenedor">

    <h2>Registrar Nuevo Administrador</h2>
    <p class="texto-ayuda">Solo el Administrador General puede registrar nuevos administradores (HUGU-01).</p>

    <!-- Formulario HUGU-01 -->
    <form id="formRegistroAdmin" class="formulario" novalidate>

        <label for="nombre">Nombre Completo *</label>
        <input type="text" id="nombre" placeholder="Nombre completo">
        <span class="mensaje-error" id="err-nombre"></span>

        <label for="correo">Correo Electrónico *</label>
        <input type="email" id="correo" placeholder="correo@ejemplo.com">
        <span class="mensaje-error" id="err-correo"></span>

        <label for="contrasena">Contraseña *</label>
        <input type="password" id="contrasena" placeholder="Mínimo 8 caracteres, 1 mayúscula, 1 número">
        <span class="mensaje-error" id="err-contrasena"></span>

        <label for="confirmarContrasena">Confirmar Contraseña *</label>
        <input type="password" id="confirmarContrasena" placeholder="Repita la contraseña">
        <span class="mensaje-error" id="err-confirmarContrasena"></span>

        <label for="rol">Rol *</label>
        <select id="rol">
            <option value="">— Seleccione un rol —</option>
            <option value="Administrador General">Administrador General</option>
            <option value="Administrador de Actividades">Administrador de Actividades</option>
        </select>
        <span class="mensaje-error" id="err-rol"></span>

        <span class="mensaje-error" id="err-registro"></span>
        <span class="mensaje-exito" id="exito-registro"></span>

        <button type="submit">Registrar Administrador</button>

    </form>

</div>
</section>
</main>

<footer>
    <p>&copy; 2026 CENFOTEC Connect.</p>
</footer>

</body>
</html>
