    <main class="container py-5">
      <div class="row justify-content-center">
          <div class="col-12 col-md-10 col-lg-8">
              <div class="card shadow-sm">
                  <div class="card-body p-4">
                      <h1 class="h2 text-center mb-2">
                          Gestión de usuarios
                      </h1>
                      <p
                          class="text-muted text-center mb-4"
                          id="bienvenida"
                      >
                          Cargando...
                      </p>
                      <!-- REGISTRO -->
                      <h2 class="h5 mb-3">
                          Registrar nuevo administrador
                      </h2>
                      <form
                          id="formRegistroAdmin"
                          novalidate
                      >
                          <div class="mb-3">
                              <label
                                  for="nombre"
                                  class="form-label"
                              >
                                  Nombre completo
                              </label>
                              <input
                                  type="text"
                                  id="nombre"
                                  class="form-control"
                                  placeholder="Nombre completo"
                              >
                              <div
                                  id="err-nombre"
                                  class="text-danger small"
                              ></div>
                          </div>
                          <div class="mb-3">
                              <label
                                  for="correo"
                                  class="form-label"
                              >
                                  Correo electrónico
                              </label>
                              <input
                                  type="email"
                                  id="correo"
                                  class="form-control"
                                  placeholder="correo@ejemplo.com"
                              >
                              <div
                                  id="err-correo"
                                  class="text-danger small"
                              ></div>
                          </div>
                          <div class="mb-3">
                              <label
                                  for="contrasena"
                                  class="form-label"
                              >
                                  Contraseña
                              </label>
                              <input
                                  type="password"
                                  id="contrasena"
                                  class="form-control"
                                  placeholder="Mínimo 8 caracteres, 1 mayúscula, 1 número"
                              >
                              <div
                                  id="err-contrasena"
                                  class="text-danger small"
                              ></div>
                          </div>
                          <div class="mb-3">
                              <label
                                  for="confirmarContrasena"
                                  class="form-label"
                              >
                                  Confirmar contraseña
                              </label>
                              <input
                                  type="password"
                                  id="confirmarContrasena"
                                  class="form-control"
                                  placeholder="Repita la contraseña"
                              >
                              <div
                                  id="err-confirmarContrasena"
                                  class="text-danger small"
                              ></div>
                          </div>
                          <div class="mb-3">
                              <label
                                  for="rol"
                                  class="form-label"
                              >
                                  Rol
                              </label>
                              <select
                                  id="rol"
                                  class="form-select"
                              >
                                  <option value="">
                                      — Seleccione un rol —
                                  </option>
                                  <option value="Administrador General">
                                      Administrador General
                                  </option>
                                  <option value="Administrador de Actividades">
                                      Administrador de Actividades
                                  </option>
                              </select>
                              <div
                                  id="err-rol"
                                  class="text-danger small"
                              ></div>
                          </div>
                          <div
                              id="err-registro"
                              class="text-danger small mb-2"
                          ></div>
                          <div
                              id="exito-registro"
                              class="text-success small mb-3"
                          ></div>
                          <div class="text-center">
                              <button
                                  type="submit"
                                  class="btn btn-primary"
                              >
                                  Registrar administrador
                              </button>
                          </div>
                      </form>
                  </div>
              </div>
              <!-- LISTADO -->
              <div class="card shadow-sm mt-4">
                  <div class="card-body">
                      <h2 class="h5 mb-3">
                          Administradores registrados
                      </h2>
                      <div class="table-responsive">
                          <table
                              class="table table-striped table-hover align-middle mb-0"
                          >
                              <thead>
                                  <tr>
                                      <th>
                                          Nombre
                                      </th>
                                      <th>
                                          Correo
                                      </th>
                                      <th>
                                          Rol
                                      </th>
                                      <th>
                                          Estado
                                      </th>
                                  </tr>
                              </thead>
                              <tbody id="tablaUsuarios">
                              </tbody>
                          </table>
                      </div>
                  </div>
              </div>
          </div>
