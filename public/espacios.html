    <main class="container py-4">
        <div class="page-header mb-4">
            <h1 class="h2">
                Registrar espacio
            </h1>
            <p class="text-muted">
                Complete el formulario para registrar un nuevo espacio.
            </p>
        </div>
        <form
            id="formEspacio"
            class="formulario"
            novalidate
        >
            <!-- NOMBRE -->
            <div class="mb-3">
                <label
                    for="nombreEspacio"
                    class="form-label"
                >
                    Nombre del espacio
                </label>
                <input
                type="text"
                id="nombreEspacio"
                name="nombre"
                class="form-control"
                placeholder="Ej. Auditorio Principal"
                required
                >
                <p
                    id="errorNombreEspacio"
                    class="mensaje-error"
                ></p>
            </div>
            <!-- SEDE -->
            <div class="mb-3">
              <label for="sedeEspacio" class="form-label">
                Sede
              </label>
              <input
                type="text"
                id="sedeEspacio"
                name="sede"
                class="form-control"
                placeholder="Ej. Sede Central"
                required
                >
                <p id="errorSedeEspacio" class="mensaje-error"></p>
            </div>
            <!-- ESTADO -->
            <div class="mb-3">

              <label for="estadoEspacio" class="form-label">
                  Estado
              </label>
              <select id="estadoEspacio" name="estado" class="form-select" required>
                  <option value="">
                      Seleccione un estado
                  </option>
                  <option value="Disponible">
                      Disponible
                  </option>
                  <option value="Ocupado">
                      Ocupado
                  </option>
                  <option value="Mantenimiento">
                      En mantenimiento
                  </option>
              </select>
              <p id="errorEstadoEspacio" class="mensaje-error"></p>
          </div>
      </div>
      <div class="d-flex flex-column flex-sm-row gap-2 justify-content-center">

            <button type="submit" class="btn btn-primary">
                Registrar espacio
            </button>
            <button
                type="reset"
                id="btnLimpiarEspacio"
                class="btn btn-primary"
                >
                Limpiar
            </button>
                <a
                    href="lista-espacios.html"
                    class="btn btn-primary"
                    >
                    Ver espacios
                </a>
        </div>
    </form>
