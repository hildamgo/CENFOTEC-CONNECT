<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Actividades | CENFOTEC Connect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a 
                class="navbar-brand d-flex align-items-center"
                href="index.html"
            >
            <img
            src="Images/Logo Oficial.jpeg"
            alt="Logo CENFOTEC Connect"
            width="45"
            height="45"
            class="rounded me-2"
            >
            CENFOTEC Connect
            </a>
            <div>
                <a
                href="actividades.html"
                class="btn btn-light btn-sm"
                >
                Registrar actividad
                </a>
            </div>
        </div>
    </nav>
    <main class="container py-5">
        <div class="mb-4">
            <h1 class="h2">
                Actividades registradas
            </h1>
            <p class="text-muted">
                Lista de actividades registradas en CENFOTEC Connect.
            </p>
        </div>
        <div class="table-responsive">
            <table class="table table-striped table-hover align-middle mb-0">
                <thead>
                    <tr>
                        <th>
                            Nombre
                        </th>
                        <th>
                            Categoría
                        </th>
                        <th>
                            Fecha
                        </th>
                        <th>
                            Horario
                        </th>
                        <th>
                            Lugar
                        </th>
                        <th>
                            Cupo
                        </th>
                        <th>
                            Responsable
                        </th>
                        <th> 
                            Estado 
                        </th>
                    </tr>
                </thead>
                <tbody id="tablaActividades">
                    <tr>
                        <td colspan="8" class="text-center">
                            Cargando actividades...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>
    <footer class="bg-dark text-white text-center py-3">
        <p class="mb-0">&copy; 2026 CENFOTEC Connect.</p>
    </footer>
    <script
        src="https://cdn.jsdelivr.net/npm.bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
