    <p class="texto-ayuda">Acceso exclusivo para administradores.</p>

    <!-- Formulario RF06 -->
    <form id="formLogin" class="formulario" novalidate>

        <label for="correo">Correo Electrónico *</label>
        <input type="email" id="correo" placeholder="correo@ejemplo.com">
        <span class="mensaje-error" id="err-correo"></span>

        <label for="contrasena">Contraseña *</label>
        <input type="password" id="contrasena" placeholder="Ingrese su contraseña">
        <span class="mensaje-error" id="err-contrasena"></span>

        <span class="mensaje-error" id="err-login"></span>

        <button type="submit">Ingresar</button>
        <a href="restablecer-contrasena.html">¿Olvidó su contraseña?</a>
