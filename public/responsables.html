    <main class="container py-5">
      <div class="row justify-content-center">
          <div class="col-12 col-md-10 col-lg-8">
              <div class="card shadow-sm">
                  <div class="card-body p-4">
                      <h1 class="h2 text-center mb-2">
                          Registrar responsable
                      </h1>
                      <p class="text-muted text-center mb-4">
                          Complete el formulario para registrar un responsable.
                      </p>
                      <form id="formResponsable" novalidate>
                          <div class="mb-3">
                              <label
                                  for="identificacion"
                                  class="form-label"
                              >
                                  Identificación
                              </label>
                              <input
                                  type="text"
                                  id="identificacion"
                                  class="form-control"
                                  placeholder="Ej. 1-1111-1111"
                              >
                              <div
                                  id="errorIdentificacion"
                                  class="text-danger small"
                              ></div>
                          </div>
                          <div class="mb-3">
                              <label
                                  for="correo"
                                  class="form-label"
                              >
                                  Correo
                              </label>
                              <input
                                  type="email"
                                  id="correo"
                                  class="form-control"
                                  placeholder="correo@ejemplo.com"
                              >
                              <div
                                  id="errorCorreo"
                                  class="text-danger small"
                              ></div>
                          </div>
                          <div class="mb-3">
                              <label
                                  for="nombre"
                                  class="form-label"
                              >
                                  Nombre
                              </label>
                              <input
                                  type="text"
                                  id="nombre"
                                  class="form-control"
                                  placeholder="Nombre"
                              >
                              <div
                                  id="errorNombre"
                                  class="text-danger small"
                              ></div>
                          </div>
                          <div class="row">
                              <div class="col-md-6 mb-3">
                                  <label
                                      for="primerApellido"
                                      class="form-label"
                                  >
                                      Primer apellido
                                  </label>
                                  <input
                                      type="text"
                                      id="primerApellido"
                                      class="form-control"
                                  >
                                  <div
                                      id="errorPrimerApellido"
                                      class="text-danger small"
                                  ></div>
                              </div>
                              <div class="col-md-6 mb-3">
                                  <label
                                      for="segundoApellido"
                                      class="form-label"
                                  >
                                      Segundo apellido
                                  </label>
                                  <input
                                      type="text"
                                      id="segundoApellido"
                                      class="form-control"
                                  >
                                  <div
                                      id="errorSegundoApellido"
                                      class="text-danger small"
                                  ></div>
                              </div>
                          </div>
                          <div class="mb-3">
                              <label
                                  for="telefono"
                                  class="form-label"
                              >
                                  Teléfono
                              </label>
                              <input
                                  type="text"
                                  id="telefono"
                                  class="form-control"
                                  placeholder="8888-8888"
                              >
                              <div
                                  id="errorTelefono"
                                  class="text-danger small"
                              ></div>
                          </div>
                          <div class="mb-3">
                              <label
                                  for="especialidad"
                                  class="form-label"
                              >
                                  Especialidad o profesión
                              </label>
                              <input
                                  type="text"
                                  id="especialidad"
                                  class="form-control"
                                  placeholder="Ingeniería, Administración..."
                              >
                              <div
                                  id="errorEspecialidad"
                                  class="text-danger small"
                              ></div>
                          </div>
                          <div class="mb-3">
                              <label
                                  for="institucion"
                                  class="form-label"
                              >
                                  Institución
                              </label>
                              <input
                                  type="text"
                                  id="institucion"
                                  class="form-control"
                                  placeholder="Universidad CENFOTEC"
                              >
                              <div
                                  id="errorInstitucion"
                                  class="text-danger small"
                              ></div>
                          </div>
                          <div class="mb-3">
                              <label
                                  for="biografia"
                                  class="form-label"
                              >
                                  Biografía
                              </label>
                              <textarea
                                  id="biografia"
                                  class="form-control"
                                  rows="4"
                                  placeholder="Resumen profesional del responsable"
                              ></textarea>
                              <div
                                  id="errorBiografia"
                                  class="text-danger small"
                              ></div>
                          </div>
                          <div class="mb-4">
                              <label
                                  for="fotografia"
                                  class="form-label"
                              >
                                  Fotografía
                              </label>
                              <input
                                type="file"
                                id="fotografia"
                                name="fotografia"
                                class="form-control"
                                accept="image/*"
                              >
                              <div id="errorFotografia" class="text-danger small"></div>
                          </div>
                          <div
                              class="d-flex flex-column flex-sm-row gap-2 justify-content-center"
                          >
                              <button
                                  type="submit"
                                  class="btn btn-primary"
                              >
                                  Guardar responsable
                              </button>
                              <button
                                  type="reset"
                                  id="btnLimpiar"
                                  class="btn btn-primary"
                              >
                                  Limpiar
                              </button>
                              <a
                                  href="lista-responsables.html"
                                  class="btn btn-primary"
                              >
                                  Ver responsables
                              </a>
                          </div>
                      </form>
                  </div>
              </div>
          </div>
      </div>
